
{% for kpi in kpis %}
<div class="col-md-3 mb-3">
    <div class="kpi-professional">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <div class="kpi-value-professional">{{ kpi.value }}</div>
                <div class="kpi-label-professional">{{ kpi.label }}</div>
            </div>
            <div class="fs-1 opacity-25">
                <i class="fas fa-chart-simple"></i>
            </div>
        </div>
        <div class="mt-2">
            {% if kpi.trend == '+' %}
            <span class="trend-up"><i class="fas fa-arrow-up"></i> Positive trend</span>
            {% elif kpi.trend == '-' %}
            <span class="trend-down"><i class="fas fa-arrow-down"></i> Negative trend</span>
            {% else %}
            <span><i class="fas fa-minus"></i> Stable</span>
            {% endif %}
        </div>
    </div>
</div>
{% endfor %}
